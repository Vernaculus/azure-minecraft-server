---
# Minecraft Server Role - Default Variables
# Override these in playbooks/site.yml or inventory

# Minecraft server version
minecraft_version: "1.21.1"
minecraft_jar_url: "https://piston-data.mojang.com/v1/objects/59353fb40c36d304f2035d51e7d6e6baa98dc05c/server.jar"

# Server resource allocation
minecraft_min_memory: "6G"
minecraft_max_memory: "6G"

# Why 6G on 8GB VM?
# OS needs ~1.5GB, leave 0.5GB buffer = 6GB for Minecraft

# Server configuration
minecraft_port: 25565
minecraft_rcon_port: 25575
minecraft_max_players: 10
minecraft_difficulty: "normal"
minecraft_gamemode: "survival"
minecraft_pvp: true

## online_mode: true (default, recommended):
#- Authenticates players with Mojang servers
#- Only paid Minecraft accounts can join
#- Prevents impersonation (players can't fake usernames)
## online_mode: false (cracked/offline):
#- No authentication
#- Anyone can join with any username
#- Security risk: Griefers can impersonate admins
minecraft_online_mode: true

# RCON security
# Generate strong password: openssl rand -base64 32
minecraft_rcon_password: ""  # Retrieved from Azure Key Vault in playbook pre-tasks

# Server identity
minecraft_motd: "Azure Minecraft Server - Managed by Ansible"
minecraft_server_name: "minecraft-server"
