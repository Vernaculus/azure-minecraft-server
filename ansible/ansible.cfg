# Ansible configuration for Minecraft server project
# This file customizes Ansible behavior for this project

[defaults]
# Path to inventory file (relative to ansible directory)
inventory = ./inventory/hosts.ini

# Directory containing roles
roles_path = ./roles

# Don't create .retry files on failure (clutters the repo)
retry_files_enabled = False

# Use color output for better readability
force_color = True

# Show task execution time for performance tracking
callback_whitelist = profile_tasks, timer

# Use YAML callback for cleaner output
stdout_callback = yaml

# Number of parallel processes (set to number of hosts)
forks = 5

# SSH timeout in seconds
timeout = 30

# Gather hardware/software facts about hosts
gathering = smart

# Cache facts for 24 hours to speed up repeated runs
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

[privilege_escalation]
# Become method (sudo)
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH multiplexing for faster connections
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no

# Use pipelining to reduce SSH operations (faster)
pipelining = True
