---
# Main playbook for Minecraft server configuration
# Orchestrates all roles in the correct order
# Usage: ansible-playbook -i ../inventory/hosts.ini site.yml

# Target the minecraft_servers group from inventory
- name: Configure Minecraft server infrastructure
  hosts: minecraft_servers
  
  # Become root to perform system-level changes
  become: true
  
  # Variables available to all roles in this playbook
  vars:
    # Minecraft server settings
    minecraft_version: "1.21.1"
    minecraft_port: 25565
    
    # System hardening settings
    ssh_port: 22
    allowed_ssh_users: "mcadmin"
    
    # Backup configuration
    backup_enabled: true
    backup_retention_days: 7
  
  # Pre-tasks run before any roles
  pre_tasks:
    # Update apt cache to ensure latest package information
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags:
        - always
    
    # Display the target server for verification
    - name: Display target server information
      ansible.builtin.debug:
        msg: "Configuring {{ inventory_hostname }} ({{ ansible_host }})"
      tags:
        - always
    
    # Install Python package manager for Azure SDK dependencies
    - name: Install pip3 for Python package management
      ansible.builtin.apt:
        name: python3-pip
        state: present
        update_cache: true
      tags:
        - keyvault
        - dependencies
    
    # Install Azure SDK libraries for Key Vault access
    # These libraries enable Python scripts on the VM to authenticate with Azure
    - name: Install Azure SDK for Python (managed identity + Key Vault)
      ansible.builtin.pip:
        name:
          - azure-identity
          - azure-keyvault-secrets
        state: present
        executable: pip3
      tags:
        - keyvault
        - dependencies
    
    # Request OAuth token from Azure Instance Metadata Service (IMDS)
    # IMDS is only accessible from inside Azure VMs at 169.254.169.254
    # The token proves the VM's managed identity to Azure Key Vault
    - name: Get OAuth token from Azure IMDS for Key Vault authentication
      ansible.builtin.uri:
        url: "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fvault.azure.net"
        method: GET
        headers:
          Metadata: "true"
        return_content: true
        status_code: 200
      register: imds_token_response
      tags:
        - keyvault
        - secrets
    
    # Extract access token from IMDS response for Key Vault authentication
    - name: Set Key Vault access token from IMDS response
      ansible.builtin.set_fact:
        keyvault_access_token: "{{ imds_token_response.json.access_token }}"
      no_log: true
      tags:
        - keyvault
        - secrets
    
    # Retrieve RCON password from Key Vault using managed identity token
    # Key Vault validates RBAC permissions before returning the secret
    - name: Retrieve RCON password from Azure Key Vault
      ansible.builtin.uri:
        url: "https://kv-minecraft-dev-scus.vault.azure.net/secrets/minecraft-rcon-password?api-version=7.4"
        method: GET
        headers:
          Authorization: "Bearer {{ keyvault_access_token }}"
        return_content: true
        status_code: 200
      register: keyvault_secret_response
      no_log: true
      tags:
        - keyvault
        - secrets
    
    # Extract secret value and make it available to all roles
    - name: Set RCON password fact from Key Vault secret
      ansible.builtin.set_fact:
        minecraft_rcon_password: "{{ keyvault_secret_response.json.value }}"
      no_log: true
      tags:
        - keyvault
        - secrets
  
  # Roles execute in order listed
  roles:
    # Role 1: System hardening (UFW, fail2ban, SSH)
    - role: system_hardening
      tags:
        - hardening
        - security
    
    # Role 2: Install and configure Minecraft server (Day 5)
    - role: minecraft_server
      tags:
        - minecraft
        - application
    
    # Role 3: Configure automated backups (Day 5)
    - role: backup_to_blob
      tags:
        - backup
        - storage
      when: false  # Disabled until Day 5
  
  # Post-tasks run after all roles complete
  post_tasks:
    # Verify the system is ready
    - name: Display completion message
      ansible.builtin.debug:
        msg: "Configuration complete on {{ inventory_hostname }}"
      tags:
        - always

